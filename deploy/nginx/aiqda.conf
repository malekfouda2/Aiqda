server {
    server_name aiqda.pro www.aiqda.pro;

    # Serve the React frontend
    root /var/www/Aiqda/frontend/dist;
    index index.html;

    # All non-API routes go to React (handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Node backend
    location /api {
        # Allow 25 MiB lesson files plus multipart overhead. The app enforces per-file limits.
        client_max_body_size 30m;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded files (creator documents, etc.)
    location /uploads {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aiqda.pro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aiqda.pro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.aiqda.pro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = aiqda.pro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name aiqda.pro www.aiqda.pro;
    return 404; # managed by Certbot
}
